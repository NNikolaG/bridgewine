name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Validacija recepata
        run: cargo run -q --locked -- recipe check
      - if: runner.os == 'macOS'
        run: cargo run -q --locked -- doctor || true

  build-macos-arm64:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Proveri da je runner arm64
        run: test "$(uname -m)" = arm64
      - run: cargo build --release --locked
      - name: Smoke test
        run: ./target/release/bw --version && ./target/release/bw recipe list
      - uses: actions/upload-artifact@v4
        with:
          name: bw-macos-arm64
          path: target/release/bw
          if-no-files-found: error
