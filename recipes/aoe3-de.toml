# Izvori: AppleGamingWiki prijave sa M1/M2 i CodeWeavers forum (2024-2025).
# Potvrditi na M5 u fazi 0.
[game]
id = "aoe3-de"
name = "Age of Empires III: Definitive Edition"
store = "steam"
steam_app_id = 933110
exe = "AoE3DE_s.exe"

[runtime]
wine = "crossover"       # gptk | crossover | system
graphics = "dxvk"        # d3dmetal | dxmt | dxvk | wined3d
directx = 11
windows_version = "win10"

[env]
WINEMSYNC = "1"
MTL_HUD_ENABLED = "0"    # 1 za Metal HUD sa FPS-om

[known_issues]
d3dmetal = "Dugmad u meniju gube tekst; koristiti DXVK"
multiplayer = "Prijave praznog lobija i 'Host Rejected' na CrossOveru, nema potvrdjenog resenja"
large_games = "4+ igraca: Graphics Quality = Medium i limit 30 FPS protiv preskakanja frejmova"

[tested]
chip = "M1 Pro"
macos = "14.x"
rating = "silver"
