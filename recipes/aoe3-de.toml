# Izvori: AppleGamingWiki i korisnicke prijave (2024-2025).
# Potvrditi na M5 u fazi 0.
[game]
id = "aoe3-de"
name = "Age of Empires III: Definitive Edition"
store = "steam"
steam_app_id = 933110
exe = "AoE3DE_s.exe"

[runtime]
# 64-bitni Steam klijent (2026+) pada na GPTK-ovom Wine 7.7 (nema BCrypt pseudo-handle),
# pa bottle koristi WineHQ (`bw runtime install`). D3DMetal ide samo uz GPTK Wine.
# wined3d (OpenGL 4.1) nema D3D11 FL11 ("video hardware does not support DirectX 11"),
# pa D3D11 ide preko DXMT-a (Metal), koji bw sam instalira u runtime.
wine = "winehq"          # gptk | winehq | system
graphics = "dxmt"        # d3dmetal | dxmt | dxvk | wined3d
directx = 11
windows_version = "win10"

[env]
WINEMSYNC = "1"
MTL_HUD_ENABLED = "0"    # 1 za Metal HUD sa FPS-om

[known_issues]
d3dmetal = "Prijavljeno: dugmad u meniju gube tekst; ako se desi, probati DXVK-macOS (docs/install-gptk.md, korak 9)"
multiplayer = "Prijave praznog lobija i 'Host Rejected' na Macu, nema potvrdjenog resenja"
large_games = "4+ igraca: Graphics Quality = Medium i limit 30 FPS protiv preskakanja frejmova"

[tested]
chip = "M5"
macos = "27.0.1"
rating = "untested"
