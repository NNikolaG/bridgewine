# Izvori: AppleGamingWiki i korisnicke prijave (2024-2025).
# Potvrditi na M5 u fazi 0.
[game]
id = "aoe3-de"
name = "Age of Empires III: Definitive Edition"
store = "steam"
steam_app_id = 933110
exe = "AoE3DE_s.exe"

[runtime]
# 64-bitni Steam klijent (2026+) pada na GPTK-ovom Wine 7.7 (nema BCrypt pseudo-handle),
# pa bottle koristi WineHQ (`bw runtime install`). D3DMetal ide samo uz GPTK Wine.
# wined3d (OpenGL 4.1) nema D3D11 FL11 ("video hardware does not support DirectX 11"),
# pa D3D11 ide preko DXVK-a (MoltenVK) samo za igru; DXMT (Metal) je u runtime-u za Steam.
# Preko DXMT-a i D3DMetal-a meni je isecen (vidi known_issues.menu_text).
wine = "winehq"          # gptk | winehq | system
graphics = "dxvk"        # d3dmetal | dxmt | dxvk | wined3d
directx = 11
windows_version = "win10"
# Nasi Wine moduli (patches/): direktni syscall-ovi (zastita igre), \\.\GLOBALROOT,
# Rosetta CPU frekvencija, zvuk (dsound red, audio tajmer). `bw setup` ih skida sa GitHub release-a ili gradi.
patched = true

[steam]
# Crn Steam prozor (Wine bug 56014): nas steamwebhelper wrapper. "none" kad Wine to sam resi.
cef_workaround = "wrapper"

[env]
WINEMSYNC = "1"
MTL_HUD_ENABLED = "0"    # 1 za Metal HUD sa FPS-om
# Zvuk ide preko DirectSound-a; nas dsound patch drzi 80 ms u redu umesto ~40 ms,
# pa zakasnelo budjenje miksera pod Rosettom ne pravi rupe (krckanje).
WINEDSOUND_QUEUE_MS = "80"

[known_issues]
menu_text = "DXMT i D3DMetal crtaju naslove i dugmad u meniju samo delimicno (Metal); zato DXVK (potvrdjeno na M5, 2026-11-01). DXMT: `bw run aoe3-de --graphics dxmt`"
multiplayer = "Prijave praznog lobija i 'Host Rejected' na Macu, nema potvrdjenog resenja"
large_games = "4+ igraca: Graphics Quality = Medium i limit 30 FPS protiv preskakanja frejmova"

[tested]
chip = "M5"
macos = "27.0.1"
rating = "untested"
